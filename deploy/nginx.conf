# nginx serves the React SPA and reverse-proxies the API to the local backend.
server {
    listen 80 default_server;
    server_name _;

    root /var/www/html;
    index index.html;

    # Backend health endpoint (used by the ALB target group + container HEALTHCHECK).
    location = /healthz {
        proxy_pass http://127.0.0.1:8080/healthz;
        proxy_set_header Host $host;
    }

    # API → FastAPI backend. LLM agent calls can take ~30–60s, so allow long reads.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # SPA client-side routing fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the HTML shell — it references content-hashed asset URLs, so a
    # stale index.html would pin browsers to an old bundle after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
}
