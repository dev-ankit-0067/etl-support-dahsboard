AWSTemplateFormatVersion: "2010-09-09"
Description: >
  OpsGuardian single-container deployment on AWS Fargate, fronted by an internet-facing
  Application Load Balancer. App config comes from Secrets Manager; AWS access uses the
  ECS task role (no static credentials).

Parameters:
  ServiceName:
    Type: String
    Default: opsguardian
  ImageUri:
    Type: String
    Description: ECR image URI (repo:tag) built from deploy/Dockerfile.
  SecretArn:
    Type: String
    Description: ARN of the Secrets Manager secret holding the app env (JSON).
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to deploy into (the account's default VPC).
  Subnets:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Public subnets for the ALB and Fargate task.
  ContainerPort:
    Type: Number
    Default: 80
  Cpu:
    Type: String
    Default: "1024"
  Memory:
    Type: String
    Default: "2048"
  DesiredCount:
    Type: Number
    Default: 1
  ExecutionRoleArn:
    Type: String
    Default: ""
    Description: Optional pre-created ECS execution role ARN. If empty, the stack creates one (needs iam:CreateRole).
  TaskRoleArn:
    Type: String
    Default: ""
    Description: Optional pre-created ECS task role ARN. If empty, the stack creates one (needs iam:CreateRole).

Conditions:
  CreateExecRole: !Equals [!Ref ExecutionRoleArn, ""]
  CreateTaskRole: !Equals [!Ref TaskRoleArn, ""]

Resources:

  # ---------------- Logging ----------------
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${ServiceName}"
      RetentionInDays: 14

  # ---------------- IAM ----------------
  # Execution role: pull the image, write logs, and read the secret at task start.
  ExecutionRole:
    Type: AWS::IAM::Role
    Condition: CreateExecRole
    Properties:
      RoleName: !Sub "${ServiceName}-exec-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-app-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref SecretArn

  # Task role: the application's runtime AWS permissions (read-only), mirroring
  # aws-backend/iam-policy.json. This replaces the static keys in the env file.
  TaskRole:
    Type: AWS::IAM::Role
    Condition: CreateTaskRole
    Properties:
      RoleName: !Sub "${ServiceName}-task-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: opsguardian-runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: GlueRead
                Effect: Allow
                Action: [glue:GetJobs, glue:GetJob, glue:GetJobRuns, glue:GetJobRun]
                Resource: "*"
              - Sid: LambdaRead
                Effect: Allow
                Action: [lambda:ListFunctions, lambda:GetFunction, lambda:ListTags]
                Resource: "*"
              - Sid: EmrRead
                Effect: Allow
                Action:
                  - elasticmapreduce:ListClusters
                  - elasticmapreduce:DescribeCluster
                  - elasticmapreduce:ListSteps
                  - elasticmapreduce:DescribeStep
                  - emr-serverless:ListApplications
                  - emr-serverless:GetApplication
                  - emr-serverless:ListJobRuns
                  - emr-serverless:GetJobRun
                Resource: "*"
              - Sid: CloudWatchRead
                Effect: Allow
                Action:
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:GetMetricData
                  - cloudwatch:ListMetrics
                  - logs:DescribeLogStreams
                  - logs:GetLogEvents
                Resource: "*"
              - Sid: CostExplorerRead
                Effect: Allow
                Action:
                  - ce:GetCostAndUsage
                  - ce:GetCostForecast
                  - budgets:DescribeBudgets
                  - budgets:ViewBudget
                  - sts:GetCallerIdentity
                Resource: "*"

  # ---------------- Networking (security groups) ----------------
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ServiceName} ALB - public HTTP"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Public HTTP

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ServiceName} Fargate task - from ALB only"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref ContainerPort
          ToPort: !Ref ContainerPort
          SourceSecurityGroupId: !Ref AlbSecurityGroup
          Description: From ALB

  # ---------------- Load balancer ----------------
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${ServiceName}-alb"
      Type: application
      Scheme: internet-facing
      Subnets: !Ref Subnets
      SecurityGroups: [!Ref AlbSecurityGroup]

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${ServiceName}-tg"
      VpcId: !Ref VpcId
      Port: !Ref ContainerPort
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: "200" }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # ---------------- ECS ----------------
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${ServiceName}-cluster"

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Ref ServiceName
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      ExecutionRoleArn: !If [CreateExecRole, !GetAtt ExecutionRole.Arn, !Ref ExecutionRoleArn]
      TaskRoleArn: !If [CreateTaskRole, !GetAtt TaskRole.Arn, !Ref TaskRoleArn]
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: app
          Image: !Ref ImageUri
          Essential: true
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              Protocol: tcp
          Environment:
            - { Name: PORT, Value: "8080" }
            - { Name: WEB_CONCURRENCY, Value: "2" }
          # Whole secret injected as one JSON env var; entrypoint expands it.
          Secrets:
            - Name: APP_SECRETS_JSON
              ValueFrom: !Ref SecretArn
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app
          HealthCheck:
            Command: ["CMD-SHELL", "curl -fsS http://localhost/healthz || exit 1"]
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 40

  Service:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      ServiceName: !Ref ServiceName
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref TaskDefinition
      HealthCheckGracePeriodSeconds: 120
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED   # public subnets, no NAT -> needed for ECR/Secrets pulls
          Subnets: !Ref Subnets
          SecurityGroups: [!Ref ServiceSecurityGroup]
      LoadBalancers:
        - TargetGroupArn: !Ref TargetGroup
          ContainerName: app
          ContainerPort: !Ref ContainerPort

Outputs:
  AlbUrl:
    Description: Public URL of the application.
    Value: !Sub "http://${LoadBalancer.DNSName}"
  ClusterName:
    Value: !Ref Cluster
  ServiceNameOut:
    Value: !Ref Service
  TaskRoleArn:
    Value: !If [CreateTaskRole, !GetAtt TaskRole.Arn, !Ref TaskRoleArn]
